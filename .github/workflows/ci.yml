name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache on-device models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: models-da2s-fp16-migan-v3

      - name: Fetch models
        run: bash scripts/fetch_models.sh

      - name: Validate models (CPU sanity check)
        run: |
          python3 -m pip install --quiet onnxruntime numpy
          python3 scripts/validate_model.py app/src/main/assets/models/depth_anything_v2_small_fp16.onnx
          python3 scripts/validate_model.py app/src/main/assets/models/migan_pipeline_v2.onnx

      - name: Read version name
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature (stable keystore)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -name apksigner | sort | tail -1)"
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/certs.txt
          EXPECTED="44778f57b53a1a7a2f06b3eaef29936d8fe5e0292fd3be5cfc1c2bdb598c5f79"
          FOUND="$(grep -i 'SHA-256 digest' /tmp/certs.txt | head -1 | sed 's/.*digest: *//' | tr -d ' \r' | tr 'A-F' 'a-f')"
          if [ "$FOUND" != "$EXPECTED" ]; then
            echo "::error::APK 签名与稳定密钥不一致（覆盖升级会失败）：$FOUND"
            exit 1
          fi
          echo "签名校验通过"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          ASSET="spatial-scene-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "/tmp/$ASSET"
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest debug build" \
              --prerelease \
              --notes "自动更新的最新构建；文件名带版本号，可直接下载历史版本：见 Releases"
          fi
          # 清掉旧资产，只保留最新一个
          for old in $(gh release view latest --json assets --jq '.assets[].name'); do
            gh release delete-asset latest "$old" --yes || true
          done
          gh release upload latest "/tmp/$ASSET"
          gh release edit latest \
            --notes "最新滚动构建 · v${VERSION} · commit ${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)"

      - name: Publish tagged milestone release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="spatial-scene-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "/tmp/$ASSET"
          NOTES="里程碑构建 ${GITHUB_REF_NAME} · commit ${GITHUB_SHA::7}

          安装说明：首次安装如遇“签名冲突”，先卸载旧版；此后所有版本共用同一密钥，可直接覆盖升级。"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "/tmp/$ASSET" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "/tmp/$ASSET" \
              --title "${GITHUB_REF_NAME}" \
              --notes "$NOTES"
          fi
