name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache depth model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: depth-model-da2s-int8-v1

      - name: Fetch depth model
        run: bash scripts/fetch_models.sh

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/spatial-scene-debug.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest /tmp/spatial-scene-debug.apk --clobber
            gh release edit latest --notes "自动更新的最新构建 · commit ${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            gh release create latest /tmp/spatial-scene-debug.apk \
              --title "Latest debug build" \
              --prerelease \
              --notes "自动更新的最新构建 · commit ${GITHUB_SHA::7}"
          fi
