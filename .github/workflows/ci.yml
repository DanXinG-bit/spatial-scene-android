name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache depth model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: depth-model-da2s-fp16-v2

      - name: Fetch depth model
        run: bash scripts/fetch_models.sh

      - name: Validate depth model (CPU sanity check)
        run: |
          python3 -m pip install --quiet onnxruntime numpy
          python3 scripts/validate_model.py app/src/main/assets/models/depth_anything_v2_small_fp16.onnx

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature (stable keystore)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -name apksigner | sort | tail -1)"
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/certs.txt
          EXPECTED="44778f57b53a1a7a2f06b3eaef29936d8fe5e0292fd3be5cfc1c2bdb598c5f79"
          FOUND="$(grep -i 'certificate SHA-256 digest' /tmp/certs.txt | head -1 | tr -d ' ' | cut -d: -f2-)"
          if [ "$(echo "$FOUND" | tr 'A-F' 'a-f')" != "$EXPECTED" ]; then
            echo "::error::APK 签名与稳定密钥不一致（覆盖升级会失败）：$FOUND"
            exit 1
          fi
          echo "签名校验通过"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/spatial-scene-debug.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest /tmp/spatial-scene-debug.apk --clobber
            gh release edit latest --notes "自动更新的最新构建 · commit ${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            gh release create latest /tmp/spatial-scene-debug.apk \
              --title "Latest debug build" \
              --prerelease \
              --notes "自动更新的最新构建 · commit ${GITHUB_SHA::7}"
          fi
